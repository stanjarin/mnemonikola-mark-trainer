<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Mnemonikola Mark Trainer</title>
<style>
:root{--bg:#111;--panel:#1b1b1b;--line:#383838;--text:#f4f4f4;--muted:#aaa;--good:#76d39a;--bad:#ff9999;--accent:#e6e6e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Helvetica,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.app{max-width:720px;margin:0 auto;padding:10px 0 18px}
h1{font-size:19px;text-align:center;margin:4px 0 10px;letter-spacing:.02em}
.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:10px}
.viewport{height:39vh;min-height:250px;max-height:430px;background:#ddd;border-radius:14px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:7px}
.viewport img{display:block;height:172.5%;width:auto;max-width:none;max-height:none;object-fit:contain;object-position:top center}
.voice{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.heard{min-height:58px;border:1px solid var(--line);border-radius:12px;background:#222;padding:10px 12px;display:flex;align-items:center;font-size:23px;font-weight:700;overflow-wrap:anywhere}
button{border:1px solid var(--line);border-radius:12px;background:#303030;color:var(--text);font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:700;padding:10px 14px}
#mic{min-width:94px;background:var(--accent);color:#111;border-color:var(--accent)}
#mic.listening{background:#ff9999}
.feedback{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:700;padding:7px 4px}
.good{color:var(--good)}.bad{color:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#next{background:var(--accent);color:#111;border-color:var(--accent)}
.stats{margin-top:10px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat{background:#222;border-radius:10px;padding:7px 3px}.lbl{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.val{font-size:18px;font-weight:700}
.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.35;margin:10px 8px 0}.hidden{display:none!important}
@media(max-width:430px){.viewport{height:37vh;min-height:230px}.heard{font-size:21px}.voice{grid-template-columns:1fr 88px}#mic{min-width:0;padding:8px}.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
<h1>MNEMONIKOLA — MARK → IMAGE</h1>
<section class="card">
  <div class="viewport"><img id="card" alt="Marked card"></div>
  <div class="voice">
    <div id="heard" class="heard">Tap SPEAK</div>
    <button id="mic" type="button">SPEAK</button>
  </div>
  <div id="feedback" class="feedback" aria-live="polite">&nbsp;</div>
  <div class="actions">
    <button id="reveal" type="button">REVEAL</button>
    <button id="next" type="button">NEXT</button>
  </div>
</section>
<section class="stats">
 <div class="stat"><span class="lbl">SEEN</span><span id="seen" class="val">0</span></div>
 <div class="stat"><span class="lbl">TRIED</span><span id="tried" class="val">0</span></div>
 <div class="stat"><span class="lbl">RIGHT</span><span id="right" class="val">0</span></div>
 <div class="stat"><span class="lbl">%</span><span id="pct" class="val">—</span></div>
</section>
<div id="note" class="note">Loading the marked-card deck…</div>
</main>
<script>
/* Exact Mnemonikola v7 card mnemonics. */
const MN={
'4C':'Car','2H':'Hun','7D':'Dot','3C':'Comb','4H':'Hair','6D':'Dope','AS':'Spade','5H':'Half','9S':'Sack','2S':'Sun','QH':'QH','3D':'Dome','QC':'Wilma','8H':'Hush','6S':'Soup','5S':'Safe','9H':'Hog','KC':'Fred','2D':'Din','JH':'J Hearts','3S':'Sum','8S':'Sash','6H':'Hop','10C':'Kiss','5D':'Dove','KD':'Fats','2C':'Can','3H':'Ham','8D':'Dish','5C':'Cough','KS':'Miles','JD':'Lt Richard','8C':'Cash','10S':'Sauce','KH':'K Hearts','JC':'Bamm-Bamm','7S':'Suit','10H':'Hiss','AD':'Diamond','4S':'Sorrow','7H':'Hot','4D':'Dear','AC':'Club','9C':'Cog','JS':'Prince','QD':'Marilyn','7C':'Cat','QS':'Diana Ross','10D':'Dose','6C':'Cap','AH':'Heart','9D':'Dagger'};
const SOURCE='https://raw.githubusercontent.com/stanjarin/marked-cards-trainer/main/index.html';
const $=id=>document.getElementById(id);
let cards=[],deck=[],current=null,seen=0,tried=0,right=0,recognition=null,listening=false,answered=false;
const aliases={
 'qh':['qh','queen hearts','queen of hearts'],
 'j hearts':['j hearts','jay hearts','jack hearts','jack of hearts'],
 'k hearts':['k hearts','kay hearts','king hearts','king of hearts'],
 'lt richard':['lt richard','lieutenant richard','lieutenant richards','richard'],
 'bamm-bamm':['bamm bamm','bam bam','bambam','bamm-bamm'],
 'diana ross':['diana ross','diane ross']
};
function norm(s){return (s||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function acceptable(spoken,expected){const s=norm(spoken),e=norm(expected);if(s===e)return true;const a=aliases[e]||[];return a.some(x=>norm(x)===s)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stats(){ $('seen').textContent=seen;$('tried').textContent=tried;$('right').textContent=right;$('pct').textContent=tried?Math.round(right/tried*100):'—'}
function next(){if(!cards.length)return;if(!deck.length)deck=shuffle(cards.map(x=>x.id));current=deck.pop();const c=cards.find(x=>x.id===current);$('card').src=c.src;seen++;answered=false;$('heard').textContent='Tap SPEAK';$('feedback').innerHTML='&nbsp;';$('feedback').className='feedback';stats();window.scrollTo({top:0,behavior:'smooth'})}
function finish(spoken){if(answered)return;answered=true;tried++;const expected=MN[current],ok=acceptable(spoken,expected);if(ok){right++;$('feedback').textContent='✓ '+expected;$('feedback').className='feedback good'}else{$('feedback').textContent='✗ '+expected+'  ['+current+']';$('feedback').className='feedback bad'}stats()}
function setupSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('mic').disabled=true;$('note').textContent='Voice recognition is not available in this browser.';return}recognition=new SR();recognition.lang='en-AU';recognition.interimResults=false;recognition.maxAlternatives=5;recognition.continuous=false;recognition.onstart=()=>{listening=true;$('mic').classList.add('listening');$('mic').textContent='LISTENING';$('heard').textContent='…'};recognition.onend=()=>{listening=false;$('mic').classList.remove('listening');$('mic').textContent='SPEAK'};recognition.onerror=e=>{$('heard').textContent=e.error==='not-allowed'?'Microphone permission needed.':'Try again.'};recognition.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);$('heard').textContent=alts[0];const expected=MN[current];const hit=alts.find(x=>acceptable(x,expected));finish(hit||alts[0])}}
$('mic').onclick=()=>{if(!recognition||answered)return;if(listening)recognition.stop();else try{recognition.start()}catch(e){}};
$('reveal').onclick=()=>{if(!current)return;answered=true;$('feedback').textContent=MN[current]+'  ['+current+']';$('feedback').className='feedback'};
$('next').onclick=next;
async function load(){try{const r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();const m=text.match(/const CARDS=(\[[\s\S]*?\]);\s*const RANKS=/);if(!m)throw new Error('Embedded deck not found');cards=JSON.parse(m[1]);cards=cards.filter(c=>MN[c.id]);if(cards.length!==52)throw new Error('Expected 52 cards, found '+cards.length);$('note').textContent='52 marked cards · voice answer · Mnemonikola v7';deck=shuffle(cards.map(x=>x.id));setupSpeech();next()}catch(e){$('note').textContent='Could not load marked-card deck: '+e.message}}
load();
</script>
</body>
</html>
